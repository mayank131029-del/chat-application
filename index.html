<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whatsdown - chatting app</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <!-- <script src="http://localhost:8000/socket.io/socket.io.js"></script> -->
    <script src="https://chat-application-server-at4k.onrender.com/socket.io/socket.io.js"></script>

</head>

<body>
    <nav class="navbar">

        <div class="nav-logo">
            <i class="fa-brands fa-signal-messenger"></i>
        </div>

        <div class="nav-title">
            <h2>Whatsdowns</h2>
        </div>

        <div class="nav-user">
            <i class="fa-solid fa-user"></i>
            <span id="username"></span>
        </div>

    </nav>
    <div class="container">
        <div class="main">
            <div class="chat-box">
                <!-- <div class="message right"> I am right</div> -->
                <div class="info center">You joined the chat</div>
                <!-- <div class="message left"> I am left</div> -->
                <!-- <div class="file right">
                    <img id="chatfile" src="m7.png" alt="">
                 </div> -->


                <!-- <div class="file-viewer">
                    <button id="close-preview" title="close">
                        <i class="fa-solid fa-circle-xmark"></i>
                    </button>
                    <img id="file" src="m7.png" alt="">
                </div> -->
            </div>
            <div class="input-box">
                <form action="" id="message-form">
                    <input type="text" name="" id="message-input" placeholder="Type your message here....">
                    <label for="file-upload" class="file-upload-btn">
                        <i class="fa-solid fa-image"></i>
                    </label>
                    <input type="file" id="file-upload" title="file">
                    <button id="send" type="submit" title="Send message"><i
                            class="fa-solid fa-paper-plane"></i></button>
                </form>

            </div>
        </div>
    </div>
    <script defer src="js/client.js"></script>
</body>

</html>
